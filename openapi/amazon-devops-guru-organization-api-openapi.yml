security:
- hmac: []
tags:
- name: Organization
paths:
  /organization/health:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: DescribeOrganizationHealth
      description: Returns active insights, predictive insights, and resource hours analyzed in last hour.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeOrganizationHealthResponse'
        '480':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
        '481':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
        '482':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '483':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                AccountIds:
                  description: The ID of the Amazon Web Services account.
                  type: array
                  items:
                    $ref: '#/components/schemas/AwsAccountId'
                  minItems: 0
                  maxItems: 5
                OrganizationalUnitIds:
                  description: The ID of the organizational unit.
                  type: array
                  items:
                    $ref: '#/components/schemas/OrganizationalUnitId'
                  minItems: 0
                  maxItems: 5
      tags:
      - Organization
  /organization/overview:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: DescribeOrganizationOverview
      description: Returns an overview of your organization's history based on the specified time range. The overview includes the total reactive and proactive insights.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeOrganizationOverviewResponse'
        '480':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
        '481':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
        '482':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '483':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - FromTime
              properties:
                FromTime:
                  description: ' The start of the time range passed in. The start time granularity is at the day level. The floor of the start time is used. Returned information occurred after this day. '
                  type: string
                  format: date-time
                ToTime:
                  description: ' The end of the time range passed in. The start time granularity is at the day level. The floor of the start time is used. Returned information occurred before this day. If this is not specified, then the current day is used. '
                  type: string
                  format: date-time
                AccountIds:
                  description: The ID of the Amazon Web Services account.
                  type: array
                  items:
                    $ref: '#/components/schemas/AwsAccountId'
                  minItems: 0
                  maxItems: 5
                OrganizationalUnitIds:
                  description: The ID of the organizational unit.
                  type: array
                  items:
                    $ref: '#/components/schemas/OrganizationalUnitId'
                  minItems: 0
                  maxItems: 5
      tags:
      - Organization
  /organization/health/resource-collection:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: DescribeOrganizationResourceCollectionHealth
      description: Provides an overview of your system's health. If additional member accounts are part of your organization, you can filter those accounts using the <code>AccountIds</code> field.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeOrganizationResourceCollectionHealthResponse'
        '480':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
        '481':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
        '482':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '483':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
      parameters:
      - name: NextToken
        in: query
        schema:
          type: string
        description: Pagination token
        required: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - OrganizationResourceCollectionType
              properties:
                OrganizationResourceCollectionType:
                  description: ' An Amazon Web Services resource collection type. This type specifies how analyzed Amazon Web Services resources are defined. The two types of Amazon Web Services resource collections supported are Amazon Web Services CloudFormation stacks and Amazon Web Services resources that contain the same Amazon Web Services tag. DevOps Guru can be configured to analyze the Amazon Web Services resources that are defined in the stacks or that are tagged using the same tag <i>key</i>. You can specify up to 500 Amazon Web Services CloudFormation stacks. '
                  type: string
                  enum:
                  - AWS_CLOUD_FORMATION
                  - AWS_SERVICE
                  - AWS_ACCOUNT
                  - AWS_TAGS
                AccountIds:
                  description: The ID of the Amazon Web Services account.
                  type: array
                  items:
                    $ref: '#/components/schemas/AwsAccountId'
                  minItems: 0
                  maxItems: 5
                OrganizationalUnitIds:
                  description: The ID of the organizational unit.
                  type: array
                  items:
                    $ref: '#/components/schemas/OrganizationalUnitId'
                  minItems: 0
                  maxItems: 5
                NextToken:
                  description: The pagination token to use to retrieve the next page of results for this operation. If this value is null, it retrieves the first page.
                  type: string
                  pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$
                  minLength: 36
                  maxLength: 36
                MaxResults:
                  description: The maximum number of results to return with a single call. To retrieve the remaining results, make another call with the returned <code>nextToken</code> value.
                  type: integer
                  minimum: 1
                  maximum: 500
      tags:
      - Organization
  /organization/insights:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: ListOrganizationInsights
      description: Returns a list of insights associated with the account or OU Id.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOrganizationInsightsResponse'
        '480':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
        '481':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
        '482':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '483':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
      parameters:
      - name: MaxResults
        in: query
        schema:
          type: string
        description: Pagination limit
        required: false
      - name: NextToken
        in: query
        schema:
          type: string
        description: Pagination token
        required: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - StatusFilter
              properties:
                StatusFilter:
                  description: ' A filter used by <code>ListInsights</code> to specify which insights to return. '
                  type: object
                  properties:
                    Ongoing:
                      allOf:
                      - $ref: '#/components/schemas/ListInsightsOngoingStatusFilter'
                      - description: ' A <code>ListInsightsAnyStatusFilter</code> that specifies ongoing insights that are either <code>REACTIVE</code> or <code>PROACTIVE</code>. '
                    Closed:
                      allOf:
                      - $ref: '#/components/schemas/ListInsightsClosedStatusFilter'
                      - description: ' A <code>ListInsightsClosedStatusFilter</code> that specifies closed insights that are either <code>REACTIVE</code> or <code>PROACTIVE</code>. '
                    Any:
                      allOf:
                      - $ref: '#/components/schemas/ListInsightsAnyStatusFilter'
                      - description: ' A <code>ListInsightsAnyStatusFilter</code> that specifies insights of any status that are either <code>REACTIVE</code> or <code>PROACTIVE</code>. '
                MaxResults:
                  description: The maximum number of results to return with a single call. To retrieve the remaining results, make another call with the returned <code>nextToken</code> value.
                  type: integer
                  minimum: 1
                  maximum: 100
                AccountIds:
                  description: 'The ID of the Amazon Web Services account. '
                  type: array
                  items:
                    $ref: '#/components/schemas/AwsAccountId'
                  minItems: 0
                  maxItems: 1
                OrganizationalUnitIds:
                  description: The ID of the organizational unit.
                  type: array
                  items:
                    $ref: '#/components/schemas/OrganizationalUnitId'
                  minItems: 0
                  maxItems: 1
                NextToken:
                  description: The pagination token to use to retrieve the next page of results for this operation. If this value is null, it retrieves the first page.
                  type: string
                  pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$
                  minLength: 36
                  maxLength: 36
      tags:
      - Organization
  /organization/insights/search:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: SearchOrganizationInsights
      description: <p> Returns a list of insights in your organization. You can specify which insights are returned by their start time, one or more statuses (<code>ONGOING</code>, <code>CLOSED</code>, and <code>CLOSED</code>), one or more severities (<code>LOW</code>, <code>MEDIUM</code>, and <code>HIGH</code>), and type (<code>REACTIVE</code> or <code>PROACTIVE</code>). </p> <p> Use the <code>Filters</code> parameter to specify status and severity search parameters. Use the <code>Type</code> parameter to specify <code>REACTIVE</code> or <code>PROACTIVE</code> in your search. </p>
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchOrganizationInsightsResponse'
        '480':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
        '481':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
        '482':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '483':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
      parameters:
      - name: MaxResults
        in: query
        schema:
          type: string
        description: Pagination limit
        required: false
      - name: NextToken
        in: query
        schema:
          type: string
        description: Pagination token
        required: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - AccountIds
              - StartTimeRange
              - Type
              properties:
                AccountIds:
                  description: 'The ID of the Amazon Web Services account. '
                  type: array
                  items:
                    $ref: '#/components/schemas/AwsAccountId'
                  minItems: 1
                  maxItems: 1
                StartTimeRange:
                  description: ' A time range used to specify when the behavior of an insight or anomaly started. '
                  type: object
                  properties:
                    FromTime:
                      allOf:
                      - $ref: '#/components/schemas/Timestamp'
                      - description: ' The start time of the time range. '
                    ToTime:
                      allOf:
                      - $ref: '#/components/schemas/Timestamp'
                      - description: ' The end time of the time range. '
                Filters:
                  description: ' Filters you can use to specify which events are returned when <code>ListEvents</code> is called. '
                  type: object
                  properties:
                    Severities:
                      allOf:
                      - $ref: '#/components/schemas/InsightSeverities'
                      - description: ' An array of severity values used to search for insights. '
                    Statuses:
                      allOf:
                      - $ref: '#/components/schemas/InsightStatuses'
                      - description: ' An array of status values used to search for insights. '
                    ResourceCollection:
                      $ref: '#/components/schemas/ResourceCollection'
                    ServiceCollection:
                      $ref: '#/components/schemas/ServiceCollection'
                MaxResults:
                  description: The maximum number of results to return with a single call. To retrieve the remaining results, make another call with the returned <code>nextToken</code> value.
                  type: integer
                  minimum: 1
                  maximum: 100
                NextToken:
                  description: The pagination token to use to retrieve the next page of results for this operation. If this value is null, it retrieves the first page.
                  type: string
                  pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$
                  minLength: 36
                  maxLength: 36
                Type:
                  description: ' The type of insights you are searching for (<code>REACTIVE</code> or <code>PROACTIVE</code>). '
                  type: string
                  enum:
                  - REACTIVE
                  - PROACTIVE
      tags:
      - Organization
components:
  schemas:
    InternalServerException: {}
    DescribeOrganizationOverviewResponse:
      type: object
      required:
      - ReactiveInsights
      - ProactiveInsights
      properties:
        ReactiveInsights:
          allOf:
          - $ref: '#/components/schemas/NumReactiveInsights'
          - description: An integer that specifies the number of open reactive insights in your Amazon Web Services account.
        ProactiveInsights:
          allOf:
          - $ref: '#/components/schemas/NumProactiveInsights'
          - description: An integer that specifies the number of open proactive insights in your Amazon Web Services account.
    ProactiveOrganizationInsightSummary:
      type: object
      properties:
        Id:
          allOf:
          - $ref: '#/components/schemas/InsightId'
          - description: The ID of the insight summary.
        AccountId:
          allOf:
          - $ref: '#/components/schemas/AwsAccountId'
          - description: The ID of the Amazon Web Services account.
        OrganizationalUnitId:
          allOf:
          - $ref: '#/components/schemas/OrganizationalUnitId'
          - description: The ID of the organizational unit.
        Name:
          allOf:
          - $ref: '#/components/schemas/InsightName'
          - description: The name of the insight summary.
        Severity:
          allOf:
          - $ref: '#/components/schemas/InsightSeverity'
          - description: ' An array of severity values used to search for insights. For more information, see <a href="https://docs.aws.amazon.com/devops-guru/latest/userguide/working-with-insights.html#understanding-insights-severities">Understanding insight severities</a> in the <i>Amazon DevOps Guru User Guide</i>.'
        Status:
          allOf:
          - $ref: '#/components/schemas/InsightStatus'
          - description: ' An array of status values used to search for insights. '
        InsightTimeRange:
          $ref: '#/components/schemas/InsightTimeRange'
        PredictionTimeRange:
          $ref: '#/components/schemas/PredictionTimeRange'
        ResourceCollection:
          $ref: '#/components/schemas/ResourceCollection'
        ServiceCollection:
          $ref: '#/components/schemas/ServiceCollection'
      description: Details about a proactive insight. This object is returned by <code>DescribeInsight</code>.
    ResourceHours:
      type: integer
    TagHealths:
      type: array
      items:
        $ref: '#/components/schemas/TagHealth'
    PredictionTimeRange:
      type: object
      required:
      - StartTime
      properties:
        StartTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: ' The time range during which a metric limit is expected to be exceeded. This applies to proactive insights only. '
        EndTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: ' The time when the behavior in a proactive insight is expected to end. '
      description: ' The time range during which anomalous behavior in a proactive anomaly or an insight is expected to occur. '
    NumReactiveInsights:
      type: integer
    StartTimeRange:
      type: object
      properties:
        FromTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: ' The start time of the time range. '
        ToTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: ' The end time of the time range. '
      description: ' A time range used to specify when the behavior of an insight or anomaly started. '
    ServiceHealths:
      type: array
      items:
        $ref: '#/components/schemas/ServiceHealth'
    TagHealth:
      type: object
      properties:
        AppBoundaryKey:
          allOf:
          - $ref: '#/components/schemas/AppBoundaryKey'
          - description: <p>An Amazon Web Services tag <i>key</i> that is used to identify the Amazon Web Services resources that DevOps Guru analyzes. All Amazon Web Services resources in your account and Region tagged with this <i>key</i> make up your DevOps Guru application and analysis boundary.</p> <important> <p>The string used for a <i>key</i> in a tag that you use to define your resource coverage must begin with the prefix <code>Devops-guru-</code>. The tag <i>key</i> might be <code>DevOps-Guru-deployment-application</code> or <code>devops-guru-rds-application</code>. When you create a <i>key</i>, the case of characters in the <i>key</i> can be whatever you choose. After you create a <i>key</i>, it is case-sensitive. For example, DevOps Guru works with a <i>key</i> named <code>devops-guru-rds</code> and a <i>key</i> named <code>DevOps-Guru-RDS</code>, and these act as two different <i>keys</i>. Possible <i>key</i>/<i>value</i> pairs in your application might be <code>Devops-Guru-production-application/RDS</code> or <code>Devops-Guru-production-application/containers</code>.</p> </important>
        TagValue:
          allOf:
          - $ref: '#/components/schemas/TagValue'
