security:
- hmac: []
tags:
- name: Service Integrations
paths:
  /service-integrations:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    get:
      operationId: DescribeServiceIntegration
      description: ' Returns the integration status of services that are integrated with DevOps Guru. The one service that can be integrated with DevOps Guru is Amazon Web Services Systems Manager, which can be used to create an OpsItem for each generated insight. '
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeServiceIntegrationResponse'
        '480':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
        '481':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
        '482':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '483':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '484':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
      parameters: []
      tags:
      - Service Integrations
    put:
      operationId: UpdateServiceIntegration
      description: ' Enables or disables integration with a service that can be integrated with DevOps Guru. The one service that can be integrated with DevOps Guru is Amazon Web Services Systems Manager, which can be used to create an OpsItem for each generated insight. '
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateServiceIntegrationResponse'
        '480':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
        '481':
          description: ConflictException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictException'
        '482':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
        '483':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '484':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ServiceIntegration
              properties:
                ServiceIntegration:
                  description: ' Information about updating the integration status of an Amazon Web Services service, such as Amazon Web Services Systems Manager, with DevOps Guru. '
                  type: object
                  properties:
                    OpsCenter:
                      $ref: '#/components/schemas/OpsCenterIntegrationConfig'
                    LogsAnomalyDetection:
                      allOf:
                      - $ref: '#/components/schemas/LogsAnomalyDetectionIntegrationConfig'
                      - description: ' Information about whether DevOps Guru is configured to perform log anomaly detection on Amazon CloudWatch log groups. '
      tags:
      - Service Integrations
components:
  schemas:
    InternalServerException: {}
    UpdateServiceIntegrationResponse:
      type: object
      properties: {}
    ServiceIntegrationConfig:
      type: object
      properties:
        OpsCenter:
          allOf:
          - $ref: '#/components/schemas/OpsCenterIntegration'
          - description: ' Information about whether DevOps Guru is configured to create an OpsItem in Amazon Web Services Systems Manager OpsCenter for each created insight. '
        LogsAnomalyDetection:
          allOf:
          - $ref: '#/components/schemas/LogsAnomalyDetectionIntegration'
          - description: ' Information about whether DevOps Guru is configured to perform log anomaly detection on Amazon CloudWatch log groups. '
      description: ' Information about the integration of DevOps Guru with another Amazon Web Services service, such as Amazon Web Services Systems Manager. '
    LogsAnomalyDetectionIntegrationConfig:
      type: object
      properties:
        OptInStatus:
          allOf:
          - $ref: '#/components/schemas/OptInStatus'
          - description: Specifies if DevOps Guru is configured to perform log anomaly detection on CloudWatch log groups.
      description: ' Information about the integration of DevOps Guru with CloudWatch log groups for log anomaly detection. You can use this to update the configuration. '
    OptInStatus:
      type: string
      enum:
      - ENABLED
      - DISABLED
      description: ' Specifies if DevOps Guru is enabled to create an Amazon Web Services Systems Manager OpsItem for each created insight. '
    ValidationException: {}
    ThrottlingException: {}
    LogsAnomalyDetectionIntegration:
      type: object
      properties:
        OptInStatus:
          allOf:
          - $ref: '#/components/schemas/OptInStatus'
          - description: Specifies if DevOps Guru is configured to perform log anomaly detection on CloudWatch log groups.
      description: ' Information about the integration of DevOps Guru with CloudWatch log groups for log anomaly detection. '
    OpsCenterIntegration:
      type: object
      properties:
        OptInStatus:
          allOf:
          - $ref: '#/components/schemas/OptInStatus'
          - description: ' Specifies if DevOps Guru is enabled to create an Amazon Web Services Systems Manager OpsItem for each created insight. '
      description: ' Information about whether DevOps Guru is configured to create an OpsItem in Amazon Web Services Systems Manager OpsCenter for each created insight. '
    AccessDeniedException: {}
    OpsCenterIntegrationConfig:
      type: object
      properties:
        OptInStatus:
          allOf:
          - $ref: '#/components/schemas/OptInStatus'
          - description: ' Specifies if DevOps Guru is enabled to create an Amazon Web Services Systems Manager OpsItem for each created insight. '
      description: ' Information about whether DevOps Guru is configured to create an OpsItem in Amazon Web Services Systems Manager OpsCenter for each created insight. You can use this to update the configuration.'
    ConflictException: {}
    DescribeServiceIntegrationResponse:
      type: object
      properties:
        ServiceIntegration:
          $ref: '#/components/schemas/ServiceIntegrationConfig'
    ResourceNotFoundException: {}
  parameters:
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
